spring.application.name=inventory-management

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# SPRING AI / GROQ
# ==========================================

spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=${GROQ_TEMPERATURE:0.3}

# ==========================================
# CORS
# ==========================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# SERVER
# ==========================================

server.port=${PORT:10000}
server.address=0.0.0.0
